name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar y configurar la parte Android
        run: |
          flutter create --platforms=android --org com.fsmovil --project-name fsmovil .
          python3 tool/configurar_android.py

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Sin clave de firma en los secretos: el APK se firma con la clave de depuración"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/fsmovil.jks
          {
            echo "storeFile=fsmovil.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependencias
        run: flutter pub get

      - name: Análisis del código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Número de versión
        id: version
        run: |
          NOMBRE=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NOMBRE="${GITHUB_REF#refs/tags/v}"; fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "codigo=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.nombre }} \
            --build-number=${{ steps.version.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-release.apk FSMovil.apk
          cp pubspec.lock pubspec.lock.compilado || true

      - uses: actions/upload-artifact@v4
        with:
          name: FSMovil-${{ steps.version.outputs.nombre }}-${{ steps.version.outputs.codigo }}
          path: |
            FSMovil.apk
            pubspec.lock.compilado

      - name: Publicar versión (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FSMovil.apk
          body: |
            FSMovil ${{ steps.version.outputs.nombre }}

            **versionCode: ${{ steps.version.outputs.codigo }}** → ponlo en FacturaScripts → App móvil → Ajustes → Número de versión.

            Descarga directa (siempre la última): https://github.com/${{ github.repository }}/releases/latest/download/FSMovil.apk
