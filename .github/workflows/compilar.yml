name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Generar y configurar la parte Android
        run: |
          flutter create --platforms=android --org com.fsmovil --project-name fsmovil .
          python3 tool/configurar_android.py

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
        run: |
          # qué datos de firma llegan (nunca se muestra su valor)
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            valor="${!v}"
            if [ -n "$valor" ]; then echo "$v: presente (${#valor} caracteres)"; else echo "$v: FALTA"; fi
          done
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Faltan datos de firma: el APK se firma con la clave de depuración"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > android/app/fsmovil.jks
          if ! keytool -list -keystore android/app/fsmovil.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::La clave de firma no se puede abrir: revisa KEYSTORE_BASE64, KEYSTORE_PASSWORD y KEY_ALIAS"
            exit 1
          fi
          echo "Clave de firma correcta"
          {
            echo "storeFile=fsmovil.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Dependencias
        run: |
          flutter pub get
          flutter pub deps --no-dev --style=compact | grep -vE '^(Dart|Flutter) SDK' | head -60

      - name: Análisis del código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Número de versión
        id: version
        run: |
          NOMBRE=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then NOMBRE="${GITHUB_REF#refs/tags/v}"; fi
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          echo "codigo=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Compilar APK
        run: |
          # solo procesadores de móvil (arm y arm64): sin las versiones para emuladores el APK pesa la mitad
          flutter build apk --release \
            --target-platform android-arm,android-arm64 \
            --build-name=${{ steps.version.outputs.nombre }} \
            --build-number=${{ steps.version.outputs.codigo }}
          cp build/app/outputs/flutter-apk/app-release.apk FSMovil.apk
          cp pubspec.lock pubspec.lock.compilado || true

      - name: Comprobar el APK
        shell: bash
        run: |
          set +e +o pipefail
          ls -lh FSMovil.apk
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          "$AAPT" dump badging FSMovil.apk > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|uses-permission|application-label:|launchable)" badging.txt
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs FSMovil.apk > firma.txt 2>&1
          grep -iE "signer #1 certificate (dn|sha-256)" firma.txt || cat firma.txt
          exit 0

      - uses: actions/upload-artifact@v5
        with:
          name: FSMovil-${{ steps.version.outputs.nombre }}-${{ steps.version.outputs.codigo }}
          path: |
            FSMovil.apk
            pubspec.lock.compilado

      - name: Publicar versión (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FSMovil.apk
          body: |
            FSMovil ${{ steps.version.outputs.nombre }}

            **versionCode: ${{ steps.version.outputs.codigo }}** → ponlo en FacturaScripts → App móvil → Ajustes → Número de versión.

            Descarga directa (siempre la última): https://github.com/${{ github.repository }}/releases/latest/download/FSMovil.apk
