name: fsmovil
description: "FSMovil: app para los empleados de empresas que usan FacturaScripts."
publish_to: 'none'

# versionName+versionCode. El workflow sustituye el versionCode por el número de compilación.
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ">=1.2.0 <2.0.0"
  shared_preferences: ">=2.3.0 <3.0.0"
  path_provider: ">=2.1.0 <3.0.0"
  mobile_scanner: ">=6.0.0 <8.0.0"
  image_picker: ">=1.1.0 <2.0.0"
  signature: ">=5.5.0 <7.0.0"
  url_launcher: ">=6.3.0 <7.0.0"
  uuid: ">=4.4.0 <5.0.0"
  package_info_plus: ">=8.0.0 <10.0.0"
  device_info_plus: ">=10.1.0 <13.0.0"
  webview_flutter: ">=4.8.0 <5.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
